[project]
name = "etl-dq"
version = "0.1.0"
description = "ETL pipeline for Data Quality"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apache-airflow==3.3.0",
    "apache-airflow-providers-celery>=3.24.0",
    "apache-airflow-providers-fab>=3.9.0",
    "asyncpg>=0.31.0",
    "levenshtein>=0.27.5",
    "numpy>=2.5.3",
    "polars>=1.44.2",
    "psycopg2-binary",
    "pyarrow>=25.0.1",
    "pymysql>=1.2.3",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0"]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
